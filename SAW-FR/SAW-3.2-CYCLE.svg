     y="325"
     text-anchor="end"
     fill="#93b8ff"
     font-size="20"
     font-weight="750"
     id="text27">04  Accepter et fermer</text>
  <text
     x="350"
     y="365"
     text-anchor="end"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text28">L'humain accepte. CONVERGENCE est</text>
