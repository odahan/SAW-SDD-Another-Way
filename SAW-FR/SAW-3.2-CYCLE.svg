  <text
     x="350"
     y="670"
     text-anchor="end"
     fill="#f3cf83"
     font-size="20"
     font-weight="750"
     id="text24">03  Évaluer les gates</text>
  <text
     x="350"
     y="710"
     text-anchor="end"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text25">Vérifier les critères AUTO, LLM et HUMAN.</text>
  <text
     x="350"
     y="735"
     text-anchor="end"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text26">La validation humaine reste explicite.</text>
