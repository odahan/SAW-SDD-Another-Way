  <title
     id="title">Préparation du projet et cycle des lots S.A.W.</title>
  <desc
     id="desc">La spécification du produit et la planification des lots précèdent la boucle. Chaque lot passe par quatre étapes, puis le lot suivant reprend au début de la boucle.</desc>
