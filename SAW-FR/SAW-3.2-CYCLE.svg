     font-weight="750"
     id="text18">01  Lancer le lot</text>
  <text
     x="850"
     y="365"
     text-anchor="start"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text19">L'humain autorise le départ. Le LLM</text>
  <text
     x="850"
     y="390"
     text-anchor="start"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text20">reconstruit le contexte documentaire.</text>
  <path
     d="M 752.7 675.7 L 820 690 L 836 690"
     fill="none"
     stroke="#a9dfb0"
     stroke-width="2"
