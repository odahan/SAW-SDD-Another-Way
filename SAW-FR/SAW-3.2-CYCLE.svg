     y="670"
     text-anchor="start"
     fill="#a9dfb0"
     font-size="20"
     font-weight="750"
     id="text21">02  Réaliser et documenter</text>
  <text
     x="850"
     y="710"
     text-anchor="start"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text22">Suivre la SPEC, produire le résultat</text>
  <text
     x="850"
     y="735"
     text-anchor="start"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text23">et consigner les découvertes dans FINDINGS.</text>
  <path
     d="M 447.3 675.7 L 380 690 L 364 690"
     fill="none"
     stroke="#f3cf83"
     stroke-width="2"
     opacity=".85"
