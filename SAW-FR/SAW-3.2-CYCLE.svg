     y="201"
     text-anchor="start"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text5">PROJECT et RULES fixent le cadre.</text>
  <text
     x="650"
     y="146"
     text-anchor="start"
     fill="#a9dfb0"
     font-size="22"
     font-weight="750"
     id="text6">02  Planifier les lots</text>
  <text
     x="650"
     y="177"
     text-anchor="start"
     fill="#c6d7e5"
     font-size="16"
     font-weight="400"
     id="text7">Découper le travail. SPEC et GATES</text>
  <text
